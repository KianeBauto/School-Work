<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="DragAndDrop.css">
    <script src="DragAndDrop.js" defer></script>

</head>
<body>
    <center>
        <h1>Drag And Drop API</h1>
    </center>
    <div class = "draggableContainer">
        <div class ="box" draggable="true" id="box">draggable1</div>
        <div class ="box" draggable="true" id="box">draggable2</div>
        <div class ="box" draggable="true" id="box">draggable3</div>
        <div class ="box" draggable="true" id="box">draggable4</div>
    </div>
        <div class = "droppableContainer">
        <div class ="droppable"  data-draggable-id  id="box">droppable1</div>
        <div class ="droppable"  data-draggable-id  id="box">droppable2</div>
        <div class ="droppable"  data-draggable-id  id="box">droppable3</div>
        <div class ="droppable"  data-draggable-id  id="box">droppable4</div>
    </div>
    
</body> 
</html>
